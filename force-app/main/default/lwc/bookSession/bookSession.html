<template>
    <lightning-card title="Speaker Details & Availability">
        <template lwc:if={speaker}>
            <div class="slds-p-around_medium">
                <p><strong>Name:</strong> {speaker.Name}</p>
                <p><strong>Speciality:</strong> {speaker.Speciality__c}</p>
                <p class="slds-m-bottom_small"><strong>Bio:</strong> {speaker.Bio__c}</p>

                <lightning-input
                    type="date"
                    label="Select Date"
                    onchange={handleDateChange}>
                </lightning-input>

                <template if:true={availableSessions.length}>
                    <lightning-radio-group
                        label="Available Time Slots"
                        options={timeSlotOptions}
                        value={selectedSessionId}
                        type="radio"
                        onchange={handleSlotSelect}>
                    </lightning-radio-group>

                    <lightning-button
                        label="Create Assignment"
                        variant="brand"
                        class="slds-m-top_medium"
                        disabled={disableCreate}
                        onclick={handleCreate}>
                    </lightning-button>
                </template>

                <template if:true={noSlots}>
                    <p class="slds-text-color_error slds-m-top_small">
                        No available time slots for the selected date.
                    </p>
                </template>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium">
                Select another speaker to view availability.
            </div>
        </template>
    </lightning-card>
</template>
